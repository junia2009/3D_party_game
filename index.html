<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ワイワイアニマルズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  /* 遊べるものを並べるだけの入口。ゲームと同じ空の色と字 */
  :root {
    --ink: #1f2a33;
    --paper: #ffffff;
    --muted: #5d6b73;
    --accent: #ff5a4e;
    --sky-top: #9fd9ff;
    --sky-bottom: #fff3d1;
    --font-display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(var(--sky-top), var(--sky-bottom)) fixed;
    color: var(--ink); font-family: var(--font-body);
  }
  main {
    max-width: 520px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 40px) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
    display: grid; gap: 18px;
  }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 11vw, 52px); line-height: 1.05; }
  h1 span { color: var(--accent); }
  .lead { margin: 0; color: var(--muted); font-weight: 800; }
  .games { display: grid; gap: 12px; }
  a.card {
    display: grid; gap: 4px; padding: 18px 20px; border-radius: 22px; background: var(--paper);
    color: var(--ink); text-decoration: none; box-shadow: 0 5px 0 rgba(31,42,51,.2);
  }
  a.card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(31,42,51,.2); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  a.card b { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
  a.card small { color: var(--muted); font-size: 14px; line-height: 1.6; }
  a.card.main { background: var(--accent); color: var(--paper); box-shadow: 0 5px 0 #b8362d; }
  a.card.main small { color: rgba(255,255,255,.88); }
  .note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>ワイワイ<br><span>アニマルズ</span></h1>
  <p class="lead">つくりかけのパーティゲーム</p>
  <div class="games">
    <a class="card main" href="./daruma.html">
      <b>だるまさんがころんだ</b>
      <small>ホーホー先生がふりむく前に、どんぐりの森をかけぬけろ。ひとり + CPU4人で遊べます。</small>
    </a>
    <a class="card" href="./viewer.html">
      <b>キャラ図鑑</b>
      <small>6人のキャラを回して見られます。アニメーション・表情・色の切りかえつき。</small>
    </a>
  </div>
  <p class="note">スマホは縦持ちがおすすめです。重さを確かめるときは、ゲームのアドレスの最後に <code>?fps</code> を付けると、1秒あたりのフレーム数が出ます。</p>
</main>
</body>
</html>
