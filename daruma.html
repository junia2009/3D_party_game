<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>だるまさんがころんだ — ワイワイアニマルズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
  /* 画面いっぱいの3D。上に字幕と時間、右に進み具合、下に走るボタン */
  :root {
    --ink: #1f2a33;
    --paper: #ffffff;
    --muted: #5d6b73;
    --accent: #ff5a4e;
    --lit: #ff8a3d;
    --watch: #e8344a;
    --sky-top: #9fd9ff;
    --sky-bottom: #fff3d1;
    --font-display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    color: var(--ink); font-family: var(--font-body);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }

  /* ── HUD ── */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
    display: flex; gap: 10px; align-items: flex-start;
  }
  .chant {
    flex: 1; min-width: 0; background: var(--paper); border-radius: 18px; padding: 8px 10px;
    display: flex; justify-content: center; gap: 1px; box-shadow: 0 3px 0 rgba(31,42,51,.18);
    font-family: var(--font-display); font-size: clamp(20px, 6.4vw, 34px); line-height: 1.15;
  }
  .chant span { color: #cfd8dc; transition: color .08s, transform .12s; }
  .chant span.on { color: var(--lit); transform: translateY(-2px); }
  .chant.watch span { color: var(--watch); }
  .chant .msg { color: var(--ink); font-size: .8em; }
  .timer {
    flex: none; width: 3.2em; text-align: center; background: var(--ink); color: var(--paper);
    border-radius: 16px; padding: 8px 0; font: 800 20px var(--font-body); font-variant-numeric: tabular-nums;
  }
  .timer small { display: block; font-size: 10px; font-weight: 700; opacity: .7; margin-top: -2px; }

  .track {
    position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 96px; bottom: 170px; width: 24px;
    background: rgba(255,255,255,.55); border-radius: 12px;
  }
  .track::before, .track::after {
    content: ''; position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .5;
  }
  .track::before { top: 10px; } .track::after { bottom: 10px; }
  .track .dot {
    position: absolute; left: 50%; width: 16px; height: 16px; margin: 0 0 -8px -8px; border-radius: 50%;
    border: 2px solid var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: bottom .1s linear;
  }
  .track .dot.me { width: 22px; height: 22px; margin: 0 0 -11px -11px; border: 3px solid var(--ink); z-index: 1; }
  .track .dot.stun { animation: shake .2s infinite; }
  @keyframes shake { 50% { transform: translateX(3px); } }

  .splash {
    position: absolute; left: 0; right: 0; top: 34%; text-align: center;
    font-family: var(--font-display); font-size: clamp(40px, 13vw, 84px); color: var(--paper);
    -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; letter-spacing: .02em;
    opacity: 0;
  }
  .splash.show { animation: pop 1.1s ease-out forwards; }
  .splash.red { color: var(--watch); }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4); }
    15% { opacity: 1; transform: scale(1.12); }
    25% { transform: scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-14px); }
  }

  .runbtn {
    pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    width: 132px; height: 132px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--paper);
    font: 800 17px/1.25 var(--font-body); box-shadow: 0 8px 0 #b8362d, 0 12px 24px rgba(0,0,0,.18);
    touch-action: none; cursor: pointer;
  }
  .runbtn.down { transform: translateX(-50%) translateY(6px); box-shadow: 0 2px 0 #b8362d; filter: brightness(1.08); }
  /* 横長の画面では右下へ(キャラに重ならないように) */
  @media (min-aspect-ratio: 1/1) {
    .runbtn { left: auto; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 46px); transform: none; width: 116px; height: 116px; }
    .runbtn.down { transform: translateY(6px); }
    .top { justify-content: center; }
    .chant { flex: 0 1 620px; }
  }
  .runbtn small { display: block; font-size: 11px; font-weight: 700; opacity: .85; }

  /* ── 選ぶ画面と結果 ── */
  .screen {
    position: fixed; inset: 0; overflow-y: auto; display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(31, 42, 51, .28);
  }
  .card {
    width: min(100%, 460px); background: var(--paper); border-radius: 26px; padding: 22px 20px;
    display: grid; gap: 14px; box-shadow: 0 6px 0 rgba(31,42,51,.25);
  }
  .card h1, .card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.1; }
  .card h1 { font-size: clamp(30px, 9vw, 40px); }
  .card h1 em { font-style: normal; color: var(--accent); }
  .card h2 { font-size: 28px; }
  .rules { margin: 0; padding-left: 1.2em; font-size: 14px; line-height: 1.7; }
  .rules b { color: var(--accent); }
  .label { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button {
    border: 2px solid #dde6e3; background: var(--paper); border-radius: 14px; padding: 8px 6px;
    font: 800 14px var(--font-body); color: var(--ink); cursor: pointer; display: grid; justify-items: center; gap: 2px;
  }
  .grid button .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25); }
  .grid button small { font-weight: 500; font-size: 11px; color: var(--muted); }
  .grid button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .primary, .secondary {
    border: 0; border-radius: 16px; padding: 14px; font: 800 18px var(--font-body); cursor: pointer;
  }
  .primary { background: var(--accent); color: var(--paper); box-shadow: 0 5px 0 #b8362d; }
  .secondary { background: #eef3f1; color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .ranks li {
    display: grid; grid-template-columns: 2.2em 20px 1fr auto; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 14px; background: #f3f7f6; font-weight: 800;
  }
  .ranks li.me { background: #fff1d6; }
  .ranks .no { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
  .ranks .dot { width: 18px; height: 18px; border-radius: 50%; }
  .ranks small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .ranks .dist { font-variant-numeric: tabular-nums; font-size: 14px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div class="loading" id="loading">よみこみ中…</div>

<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="chant" id="chant" aria-live="polite"></div>
    <div class="timer" id="timer">60<small>びょう</small></div>
  </div>
  <div class="track" id="track"></div>
  <div class="splash" id="splash"></div>
  <button class="runbtn" id="run" type="button">おしてる間<br>はしる<small>スペースキーでも</small></button>
</div>

<section class="screen" id="select" hidden>
  <div class="card">
    <h1>だるまさんが<br><em>ころんだ</em></h1>
    <ul class="rules">
      <li><b>長押し</b>で走る。はなすと止まる(少し滑る)。</li>
      <li>ホーホー先生が<b>ふりむいたら</b>ぴたっと止まる。</li>
      <li>動いているのが見つかると、<b>5m もどされる</b>。</li>
      <li>先にゴールにタッチした人の勝ち!</li>
    </ul>
    <p class="label">キャラをえらぶ</p>
    <div class="grid" id="chars"></div>
    <button class="primary" id="start" type="button">スタート</button>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="card">
    <h2 id="resultTitle"></h2>
    <ol class="ranks" id="ranks"></ol>
    <div class="row">
      <button class="primary" id="again" type="button">もういちど</button>
      <button class="secondary" id="reselect" type="button">えらびなおす</button>
    </div>
  </div>
</section>

<script type="module" src="./src/games/daruma/game.js"></script>
</body>
</html>
